<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <title>Admin Login - Ishank Textile</title>
    <link rel="stylesheet" href="site.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script src="security-utils.js"></script>
    <script src="firebase-config.js?v=no-appcheck-20260803"></script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.14);
        }

        .login-bg {
            background:
                radial-gradient(circle at 2px 2px, rgba(255,255,255,0.035) 1px, transparent 0),
                linear-gradient(135deg, #121c26 0%, #232a31 50%, #121c26 100%);
            background-size: 4px 4px, auto;
        }

        .form-input {
            transition: all 0.3s ease;
            border: 2px solid #e5e7eb;
        }
        .form-input:focus {
            border-color: #aa0021;
            box-shadow: 0 0 0 3px rgba(170, 0, 33, 0.12);
        }

        .password-input::-ms-reveal,
        .password-input::-ms-clear {
            display: none;
            width: 0;
            height: 0;
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .error-message {
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo Section -->
        <div class="text-center mb-8">
            <img class="mx-auto h-16 w-auto object-contain mb-4 filter drop-shadow-md" src="logo.png" alt="Ishank Textile Logo"/>
            <h1 class="text-2xl font-bold text-white mb-2">Admin Login</h1>
            <p class="text-gray-400">Ishank Textile Management System</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card p-8">
            <form id="loginForm" class="space-y-6">
                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                        <input
                            type="email"
                            id="email"
                            required
                            maxlength="254"
                            autocapitalize="none"
                            spellcheck="false"
                            class="form-input w-full pl-10 pr-4 py-3 rounded-lg"
                            placeholder="admin@example.com"
                            autocomplete="email"
                        >
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input
                            type="password"
                            id="password"
                            required
                            maxlength="4096"
                            class="password-input form-input w-full pl-10 pr-14 py-3 rounded-lg"
                            placeholder="Enter password"
                            autocomplete="current-password"
                        >
                        <button
                            type="button"
                            data-action="togglePassword"
                            aria-label="Show password"
                            aria-pressed="false"
                            class="absolute right-3 top-1/2 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full text-gray-500 hover:text-gray-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-orange focus-visible:ring-offset-2"
                        >
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden error-message bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg text-sm">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="errorText">Invalid credentials</span>
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full bg-brand-orange hover:bg-brand-orange-dark text-white font-semibold py-3 rounded-lg transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg hover:shadow-xl"
                >
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    Login
                </button>

                <!-- Back to Website -->
                <div class="text-center pt-4">
                    <a href="index.html" class="text-gray-500 hover:text-brand-orange text-sm transition-colors">
                        <i class="fas fa-arrow-left mr-1"></i>
                        Back to Website
                    </a>
                </div>
            </form>
        </div>

        <!-- Security Notice -->
        <div class="text-center mt-6 text-gray-500 text-xs">
            <i class="fas fa-shield-alt mr-1"></i>
            Secure Admin Access Only
        </div>
    </div>

    <script src="scripts/admin-login-1.js"></script>
<script src="event-handlers.js"></script>
</body>
</html>
